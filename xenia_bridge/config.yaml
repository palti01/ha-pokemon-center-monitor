name: Xenia Bridge
version: "1.1.0"
slug: xenia_bridge
description: Bindet die Mahlkönig Xenia lokal per MQTT in Home Assistant ein (Ein/Aus-Schalter, Temperaturen).
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
services:
  - mqtt:need
options:
  host: 192.168.178.84
  poll_interval_s: 15
schema:
  host: str
  poll_interval_s: int(5,300)
